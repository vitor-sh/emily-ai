<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emily — Identificar música</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#1c1b19;color:#eee9e3;font:16px system-ui;padding:24px}h1{font-size:23px}p{color:#b9ada1;line-height:1.5}button,select{background:#302b26;color:#eee9e3;border:1px solid #685344;border-radius:12px;padding:12px;cursor:pointer;font:inherit}button:hover{background:#49342b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}img{width:150px;height:150px;object-fit:cover;border-radius:18px;display:block;margin:20px auto}.pulse{font-size:58px;text-align:center;color:#ed9b70;margin:25px;animation:pulse 1.2s infinite alternate}@keyframes pulse{to{opacity:.4;transform:scale(.9)}}small{display:block;color:#b9ada1;margin-top:16px}#message{min-height:48px}button:disabled{opacity:.5}a{color:#eea780}#matches button{width:100%;text-align:left;margin-top:8px}</style>
<h1>🎵 Qual música é essa?</h1><div id="motion" class="pulse" hidden>♫</div><p id="message">Escolha o som do PC ou o microfone para ouvir o ambiente.</p>
<section id="controls"><select id="source"><option value="sistema">Som do PC</option><option value="microfone">Microfone / ambiente</option></select><div class="actions"><button id="start">Ouvir 12 segundos</button><button id="long">Ouvir outro trecho · 24 s</button></div><small>O reconhecimento usa Shazam. O áudio deste pedido não fica salvo.</small></section>
<button id="cancel" hidden>Parar escuta</button><button id="fallback" hidden>Ouvir e tentar com AudD</button><section id="track" hidden><img id="cover" alt="Capa da música" hidden><h2 id="title"></h2><p id="artist"></p><div class="actions"><button id="listen">Ouvir no Emily Music</button><button id="save">Salvar no Emily Music</button><button id="youtube">Abrir YouTube</button></div><small>Confira a versão na busca antes de ouvir ou salvar.</small></section><section id="mini" hidden><h3 id="mini-title"></h3><p id="mini-status"></p><div class="actions"><button id="mini-toggle">Pausar / reproduzir</button><button id="mini-stop">Parar áudio</button></div></section><div id="matches"></div><p id="feedback" role="status"></p>
<script>
let current=null,busy=false,previous='';const el=id=>document.getElementById(id);const api=()=>window.pywebview.api;
async function poll(){try{const s=await api().music_identify_state();const encoded=JSON.stringify(s);if(encoded===previous)return;previous=encoded;busy=['ouvindo','identificando'].includes(s.fase);el('motion').hidden=!busy;el('cancel').hidden=!busy;el('controls').hidden=busy;el('fallback').hidden=busy||!s.audd_configurado;el('track').hidden=!s.musica;el('message').textContent=s.fase==='ouvindo'?`Ouvindo ${s.fonte==='sistema'?'o som do PC':'o ambiente'}… ${s.segundos||0}/${s.total} s`:s.fase==='identificando'?'Procurando uma correspondência…':s.mensagem|| (s.musica?'Música encontrada': 'Escolha uma fonte para identificar.');if(s.musica){current=s.musica;el('title').textContent=current.titulo;el('artist').textContent=current.artista;el('cover').hidden=!current.capa;if(current.capa)el('cover').src=current.capa;}}catch(e){el('message').textContent='Não consegui consultar a identificação.';}}
async function start(seconds,audd=false){el('matches').replaceChildren();el('feedback').textContent='';await api().music_identify_start(el('source').value,seconds,audd);previous='';await poll();}
el('fallback').onclick=()=>start(12,true);el('start').onclick=()=>start(12);el('long').onclick=()=>start(24);el('cancel').onclick=()=>api().music_identify_cancel();
el('youtube').onclick=()=>{if(current)api().music_identify_youtube();};
async function candidates(save){if(!current)return;el('feedback').textContent='Buscando versões no YouTube…';const r=await api().playlist_buscar_preview(current.consulta);const box=el('matches');box.replaceChildren();for(const m of r.resultados||[]){const b=document.createElement('button');b.textContent=(save?'Salvar: ':'Ouvir: ')+m.titulo;b.onclick=async()=>{if(save){const ok=await api().playlist_adicionar(m.video_id,m.titulo,m.thumb);el('feedback').textContent=ok?'Salva na playlist atual.':'Não consegui salvar.';}else{await api().music_identify_play(m);el('feedback').textContent='Abrindo a música.';}box.replaceChildren();};box.append(b);}if(!box.children.length)el('feedback').textContent=r.erro||'Não encontrei uma versão no YouTube.';else el('feedback').textContent='Escolha a versão desejada:';}
el('listen').onclick=()=>candidates(false);el('save').onclick=()=>candidates(true);async function pollMini(){try{const p=await api().music_identify_player();el('mini').hidden=!p.titulo;if(p.titulo){el('mini-title').textContent=p.titulo;el('mini-toggle').textContent=p.tocando?'Pausar':'Reproduzir';el('mini-status').textContent=(p.tocando?'Reproduzindo':'Pausada')+' · '+Math.floor((p.posicao||0)/60)+':'+String(Math.floor((p.posicao||0)%60)).padStart(2,'0');}}catch{}}
el('mini-toggle').onclick=()=>api().music_identify_control('alternar');el('mini-stop').onclick=async()=>{await api().music_identify_control('parar');await pollMini();};
window.addEventListener('pywebviewready',()=>{poll();pollMini();setInterval(poll,400);setInterval(pollMini,1000);});
</script></html>
