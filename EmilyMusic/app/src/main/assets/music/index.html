<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Emily Music</title><link rel="stylesheet" href="estilo.css"><link rel="stylesheet" href="emily-music.css"><link rel="stylesheet" href="mobile.css"></head><body><button id="btn-music" hidden></button><div id="music-toast" role="status"></div><div class="player-barra" id="player-barra" role="region" aria-label="Reprodutor de música" hidden>
  <img class="player-ambiente" id="player-ambiente" alt="" aria-hidden="true">
  <div class="player-seek-row">
    <span class="player-time" id="player-time-cur">0:00</span>
    <input type="range" class="player-seek" id="player-seek" min="0" max="100" value="0" step="0.1"
           title="Arrastar pra buscar" aria-label="Posição da música">
    <span class="player-time" id="player-time-dur">0:00</span>
  </div>
  <div class="player-barra-inner">
    <button class="player-faixa" id="player-faixa" type="button" title="Abrir fila de reprodução">
      <span class="player-capa">
        <img class="player-thumb" id="player-thumb" alt="">
        <span class="player-eq" aria-hidden="true"><i></i><i></i><i></i></span>
      </span>
      <span class="player-info">
        <strong class="player-titulo" id="player-titulo">—</strong>
        <small class="player-sub" id="player-sub" aria-live="polite">Emily Music</small>
      </span>
    </button>

    <!-- Sequência linear centralizada: shuffle · prev · PLAY · next · loop.
         Ícones em STROKE (linha leve), mesmo traço do botão Emily Music. -->
    <div class="player-centro" id="player-centro">
      <button class="pbtn pbtn-mini" id="player-shuffle" title="Aleatório" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M16 3H21V8"/><path d="M4 20L21 3"/><path d="M21 16V21H16"/><path d="M15 15L21 21"/><path d="M4 4L9 9"/></svg>
      </button>
      <button class="pbtn" id="player-prev" title="Anterior">
        <svg viewBox="0 0 24 24"><path d="M19 20L9 12L19 4V20Z"/><path d="M5 19V5"/></svg>
      </button>
      <button class="pbtn pbtn-play pausado" id="player-play" title="Tocar/Pausar" aria-label="Tocar">
        <svg viewBox="0 0 24 24" class="ico-play"><path d="M8 5.5V18.5L19 12L8 5.5Z"/></svg>
        <svg viewBox="0 0 24 24" class="ico-pause"><path d="M8 5V19M16 5V19"/></svg>
      </button>
      <button class="pbtn" id="player-next" title="Próxima">
        <svg viewBox="0 0 24 24"><path d="M5 4L15 12L5 20V4Z"/><path d="M19 5V19"/></svg>
      </button>
      <button class="pbtn pbtn-mini" id="player-loop" title="Repetir playlist" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M17 2L21 6L17 10"/><path d="M3 11V10C3 7.8 4.8 6 7 6H21"/><path d="M7 22L3 18L7 14"/><path d="M21 13V14C21 16.2 19.2 18 17 18H3"/></svg>
        <span class="loop-badge" id="loop-badge" hidden>1</span>
      </button>
    </div>

    <!-- Volume + janela: UM bloco só na zona direita, espelhando a info -->
    <div class="player-dir">
      <div class="player-vol" title="Volume">
        <button class="pbtn pbtn-mini" id="player-mute" title="Silenciar">
          <svg viewBox="0 0 24 24" id="vol-ico-alto"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18.5 5.5a9 9 0 010 13"/></svg>
          <svg viewBox="0 0 24 24" id="vol-ico-mudo" hidden><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>
        </button>
        <div class="player-vol-slider-wrap">
          <input type="range" class="player-vol-slider" id="player-vol" min="0" max="100" value="100"
                 aria-label="Volume">
          <span class="player-vol-pct" id="player-vol-pct">100%</span>
        </div>
      </div>
      <div class="player-janela">
        <button class="pbtn pbtn-mini" id="player-minimizar" title="Minimizar barra (a música continua)">
          <svg viewBox="0 0 16 16"><path d="M2 8a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 8z"/></svg>
        </button>
        <button class="pbtn pbtn-mini" id="player-fechar" title="Fechar player">
          <svg viewBox="0 0 16 16"><path d="M2.47 2.47a.75.75 0 0 1 1.06 0L8 6.94l4.47-4.47a.75.75 0 1 1 1.06 1.06L9.06 8l4.47 4.47a.75.75 0 1 1-1.06 1.06L8 9.06l-4.47 4.47a.75.75 0 0 1-1.06-1.06L6.94 8 2.47 3.53a.75.75 0 0 1 0-1.06z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Emily Music: biblioteca independente da fila em reprodução. -->
<div class="modal-player" id="modal-player" hidden>
  <section class="modal-player-caixa emusic" role="dialog" aria-modal="true" aria-labelledby="modal-player-titulo">
    <header class="emusic-top">
      <div class="emusic-brand"><span class="emusic-logo" aria-hidden="true"><img src="emily-music-icon.png" alt="" width="42" height="42"></span><div><small>SEU SOM, SEU ESPAÇO</small><h2 id="modal-player-titulo">Emily Music</h2></div></div>
      <form class="pl-busca-form" id="pl-form"><input type="search" id="pl-query" placeholder="O que você quer ouvir? Música ou link do YouTube" aria-label="Buscar música no YouTube" autocomplete="off"><button type="submit" class="pl-buscar" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg></button></form>
      <button class="icone-btn" id="modal-player-fechar" aria-label="Voltar ao chat" title="Voltar ao chat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="emusic-layout">
      <aside class="pl-sidebar" id="pl-sidebar">
        <nav class="emusic-tabs" aria-label="Emily Music">
          <button data-music-tab="inicio" class="ativo">Início</button><button data-music-tab="biblioteca">Biblioteca</button><button data-music-tab="favoritas">Curtidas</button><button data-music-tab="fila">Fila</button><button data-music-tab="letras">Letras</button>
        </nav>
        <div class="pl-sidebar-topo"><span class="pl-sidebar-tit">Suas playlists</span><button class="icone-btn mini" id="pl-nova" title="Criar playlist" aria-label="Criar playlist"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
        <input id="music-filter-playlists" type="search" placeholder="Filtrar biblioteca" aria-label="Filtrar playlists">
        <nav class="pl-sidebar-lista" id="pl-sidebar-lista" aria-label="Playlists"></nav>
        <small class="emusic-source">Seu acervo • YouTube</small>
      </aside>
      <main class="emusic-content">
        <div class="emusic-viewbar"><span id="music-breadcrumb">Início</span><div><button class="btn-linha" id="pl-tocar-tudo">Tocar playlist</button><button class="btn-linha" id="pl-filtro-fav" aria-pressed="false">Só curtidas</button></div></div>
        <p class="modal-player-erro" id="pl-erro" role="status" hidden></p>
        <section class="pl-preview" id="pl-preview" hidden></section>
        <section id="music-home"></section>
        <section id="music-library" hidden><div class="pl-info" id="pl-info"></div><div class="music-track-tools"><input id="music-filter-tracks" type="search" placeholder="Encontrar nesta playlist" aria-label="Filtrar faixas"><select id="music-sort" aria-label="Ordenar faixas"><option value="ordem">Ordem da playlist</option><option value="titulo">Título A–Z</option><option value="recentes">Adicionadas recentemente</option></select></div><nav class="modal-player-lista" id="pl-lista" aria-label="Músicas"></nav></section>
        <section id="music-queue" hidden></section>
        <section id="music-lyrics" hidden><div class="music-lyrics-head"><small>ACOMPANHE A MÚSICA</small><h2>Letras</h2><p>Escolha a gravação para acompanhar a letra certa.</p></div><form id="music-lyrics-form"><input id="music-lyrics-query" placeholder="Música e artista" aria-label="Buscar letra"><button class="btn-linha">Buscar letra</button></form><div id="music-lyrics-results" aria-live="polite"></div><div id="music-lyrics-text"></div><small class="music-credit">Letras fornecidas pelo LRCLIB. Nem todas as músicas têm letra ou sincronização.</small></section>
      </main>
      <aside class="emusic-now" id="music-now"></aside>
    </div>
    <footer id="music-dock"></footer>
  </section>
</div>

<template id="tpl-modal-playlist">
	  <div class="pl-modal-overlay" id="pl-modal-overlay" hidden>
	    <div class="pl-modal" id="pl-modal">
	      <div class="pl-modal-header">
	        <h3 id="pl-modal-titulo">Nova playlist</h3>
	        <button class="icone-btn mini pl-modal-fechar" title="Cancelar">
	          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
	        </button>
	      </div>
	      <div class="pl-modal-corpo">
	        <div class="pl-modal-foto" id="pl-modal-foto">
	          <div class="pl-modal-foto-img" id="pl-modal-foto-img">
	            <svg viewBox="0 0 24 24"><path d="M21 19V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2z"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
	          </div>
	          <input type="file" id="pl-modal-foto-input" accept="image/png,image/jpeg" hidden>
	        </div>
	        <div class="pl-modal-campos">
	          <label class="pl-modal-label">Nome</label>
	          <input type="text" class="pl-modal-nome" id="pl-modal-nome" placeholder="Ex: Favoritas" spellcheck="false" maxlength="30">
	          <div class="pl-modal-botoes">
	            <button class="btn-secundario" id="pl-modal-cancelar">Cancelar</button>
	            <button class="btn-primario" id="pl-modal-confirmar">Criar</button>
	          </div>
	        </div>
	      </div>
	    </div>
	  </div>
	</template>

	<script src="bridge.js"></script><script src="player.js"></script><script src="emily-music.js"></script><script src="native-player.js"></script><script src="mobile-ui.js"></script><script src="playlist-search.js"></script><script src="listening-ui.js"></script><script src="import-playlists.js"></script><script src="youtube-playlists.js"></script></body></html>
